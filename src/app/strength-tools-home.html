<section class="strength-tools-home" aria-label="Herramientas de fuerza">
  <div class="simple-tool-list">
    @for (tool of tools; track tool.id) {
      <button type="button" class="simple-tool" (click)="openTool.emit(tool.id)"><span>{{ tool.title }}</span><span aria-hidden="true">→</span></button>
    }
  </div>
</section>
